<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc"><title id="title">Routing decisions</title><desc id="desc">Tiny edits stay local. Risk flags escalate. Jev can choose a worker or ask for context. Failures return a labeled fallback.</desc><rect width="100%" height="100%" fill="#0b1220"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#7c94b8"/></marker></defs>
<text x="48" y="62" fill="#f8fafc" font-family="Arial, sans-serif" font-size="36" font-weight="700">A decision you can inspect</text>
<text x="48" y="100" fill="#a8bad2" font-family="Arial, sans-serif" font-size="21" font-weight="400">The host owns execution. Jev supplies one bounded judgment.</text>
<rect x="48" y="148" width="345" height="140" rx="18" fill="#142238" stroke="#5eead4" stroke-width="1.5"/>
<text x="70" y="182" fill="#5eead4" font-family="Arial, sans-serif" font-size="23" font-weight="700">TINY OR OBVIOUS?</text>
<text x="70" y="216" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Host works directly</text>
<text x="70" y="242" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">No Jev call needed</text>
<rect x="439" y="148" width="713" height="140" rx="18" fill="#142238" stroke="#fbbf24" stroke-width="1.5"/>
<text x="461" y="182" fill="#fbbf24" font-family="Arial, sans-serif" font-size="23" font-weight="700">EXPLICIT POLICY FLAGS?</text>
<text x="461" y="216" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Security / architecture / two failed approaches</text>
<text x="461" y="242" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Codex: Sol High   |   Claude: Opus   |   No API call</text>
<rect x="48" y="358" width="1104" height="114" rx="18" fill="#142238" stroke="#5eead4" stroke-width="1.5"/>
<text x="70" y="392" fill="#5eead4" font-family="Arial, sans-serif" font-size="23" font-weight="700">OTHER NONTRIVIAL TASKS</text>
<text x="70" y="426" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Minimal task summary + criteria → Jev Choice → validated routing result</text>
<text x="646" y="322" fill="#a8bad2" font-family="Arial, sans-serif" font-size="16">No policy flag applies</text>
<path d="M620,290 L620,345" stroke="#7c94b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="48" y="540" width="345" height="142" rx="18" fill="#142238" stroke="#5eead4" stroke-width="1.5"/>
<text x="70" y="574" fill="#5eead4" font-family="Arial, sans-serif" font-size="23" font-weight="700">KNOWN LANE</text>
<text x="70" y="608" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Host launches one worker</text>
<text x="70" y="634" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Requested profile and model</text>
<rect x="427" y="540" width="345" height="142" rx="18" fill="#142238" stroke="#fbbf24" stroke-width="1.5"/>
<text x="449" y="574" fill="#fbbf24" font-family="Arial, sans-serif" font-size="23" font-weight="700">UNKNOWN</text>
<text x="449" y="608" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Gather missing context</text>
<text x="449" y="634" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">No actionable worker</text>
<rect x="807" y="540" width="345" height="142" rx="18" fill="#142238" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="829" y="574" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="23" font-weight="700">SERVICE FAILURE</text>
<text x="829" y="608" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Labeled local fallback</text>
<text x="829" y="634" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Luna Medium / Sonnet</text>
<path d="M220,474 L220,527" stroke="#7c94b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M600,474 L600,527" stroke="#7c94b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M980,474 L980,527" stroke="#7c94b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="48" y="754" fill="#a8bad2" font-family="Arial, sans-serif" font-size="18" font-weight="400">The host assesses policy flags before calling Jev; these flags are not an automatic risk detector.</text>
<text x="48" y="791" fill="#a8bad2" font-family="Arial, sans-serif" font-size="18" font-weight="400">The parent reviews diffs and checks. Missing permissions and unavailable models remain explicit.</text>
<text x="48" y="831" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="400">Instruction-driven delegation — not a background hook or a standalone agent runner.</text>
</svg>