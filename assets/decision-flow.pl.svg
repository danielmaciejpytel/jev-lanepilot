<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc"><title id="title">Decyzje o doborze wykonawcy</title><desc id="desc">Drobne zmiany bez delegacji. Flagi ryzyka powodują eskalację. Jev wybiera profil lub UNKNOWN. Błąd usługi daje jawny wybór awaryjny.</desc><rect width="100%" height="100%" fill="#0b1220"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#7c94b8"/></marker></defs>
<text x="48" y="62" fill="#f8fafc" font-family="Arial, sans-serif" font-size="36" font-weight="700">Decyzja, którą możesz sprawdzić</text>
<text x="48" y="100" fill="#a8bad2" font-family="Arial, sans-serif" font-size="21" font-weight="400">Aplikacja odpowiada za wykonanie. Jev ocenia jedno konkretne pytanie.</text>
<rect x="48" y="148" width="345" height="140" rx="18" fill="#142238" stroke="#5eead4" stroke-width="1.5"/>
<text x="70" y="182" fill="#5eead4" font-family="Arial, sans-serif" font-size="21" font-weight="700">DROBNE LUB OCZYWISTE?</text>
<text x="70" y="216" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Agent wykonuje zadanie sam</text>
<text x="70" y="242" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Bez wywołania Jev</text>
<rect x="439" y="148" width="713" height="140" rx="18" fill="#142238" stroke="#fbbf24" stroke-width="1.5"/>
<text x="461" y="182" fill="#fbbf24" font-family="Arial, sans-serif" font-size="21" font-weight="700">JAWNE FLAGI LOKALNYCH REGUŁ?</text>
<text x="461" y="216" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Bezpieczeństwo / architektura / dwie nieudane próby</text>
<text x="461" y="242" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Codex: Sol High   |   Claude: Opus   |   Bez wywołania API</text>
<rect x="48" y="358" width="1104" height="114" rx="18" fill="#142238" stroke="#5eead4" stroke-width="1.5"/>
<text x="70" y="392" fill="#5eead4" font-family="Arial, sans-serif" font-size="21" font-weight="700">POZOSTAŁE NIETRYWIALNE ZADANIA</text>
<text x="70" y="426" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Krótki opis zadania + kryteria → Jev Choice → sprawdzony wynik doboru</text>
<text x="646" y="322" fill="#a8bad2" font-family="Arial, sans-serif" font-size="16">Brak flag uruchamiających regułę</text>
<path d="M620,290 L620,345" stroke="#7c94b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="48" y="540" width="345" height="142" rx="18" fill="#142238" stroke="#5eead4" stroke-width="1.5"/>
<text x="70" y="574" fill="#5eead4" font-family="Arial, sans-serif" font-size="21" font-weight="700">WYBRANY PROFIL</text>
<text x="70" y="608" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Aplikacja uruchamia wykonawcę</text>
<text x="70" y="634" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Zgodnie z profilem i modelem</text>
<rect x="427" y="540" width="345" height="142" rx="18" fill="#142238" stroke="#fbbf24" stroke-width="1.5"/>
<text x="449" y="574" fill="#fbbf24" font-family="Arial, sans-serif" font-size="21" font-weight="700">UNKNOWN</text>
<text x="449" y="608" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Zbierz brakujący kontekst</text>
<text x="449" y="634" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Nie uruchamiaj wykonawcy</text>
<rect x="807" y="540" width="345" height="142" rx="18" fill="#142238" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="829" y="574" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="21" font-weight="700">BŁĄD USŁUGI</text>
<text x="829" y="608" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Jawny lokalny wybór awaryjny</text>
<text x="829" y="634" fill="#e5edf8" font-family="Arial, sans-serif" font-size="18" font-weight="400">Luna Medium / Sonnet</text>
<path d="M220,474 L220,527" stroke="#7c94b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M600,474 L600,527" stroke="#7c94b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M980,474 L980,527" stroke="#7c94b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="48" y="754" fill="#a8bad2" font-family="Arial, sans-serif" font-size="18" font-weight="400">Aplikacja ocenia flagi przed wywołaniem Jev. Flagi nie wykrywają ryzyka automatycznie.</text>
<text x="48" y="791" fill="#a8bad2" font-family="Arial, sans-serif" font-size="18" font-weight="400">Agent prowadzący sprawdza diff i wyniki. Zgłasza brak uprawnień lub dostępnego modelu.</text>
<text x="48" y="831" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="400">Delegacją sterują instrukcje. Nie działa ona jako hook w tle ani samodzielny program wykonawczy.</text>
</svg>